[project]
name = "vig-minimax-h3-director"
description = "A video editing studio for MiniMax H3 in one ComfyUI node: write clips in plain language, get format-valid prompts, render picture and sound, carry motion from clip to clip, join a film."
version = "1.0.1"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dependencies = ["opencv-python-headless"]
[project.urls]
Repository = "https://github.com/Weloyo/VIG-MiniMaxH3-Director"
"Bug Tracker" = "https://github.com/Weloyo/VIG-MiniMaxH3-Director/issues"
Funding = "https://ko-fi.com/vigpay"
[tool.comfy]
PublisherId = "weloyo"
DisplayName = "(VIG) MiniMax H3 Director"
Icon = "https://raw.githubusercontent.com/Weloyo/VIG-MiniMaxH3-Director/main/docs/images/icon.png"
Banner = "https://raw.githubusercontent.com/Weloyo/VIG-MiniMaxH3-Director/main/docs/images/banner.jpg"
requires-comfyui = ">=0.32.0"
includes = []
